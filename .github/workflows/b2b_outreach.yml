name: B2B Outreach & Weekly Reporting Engine

on:
  schedule:
    # Invio lotti Outreach: Lunedì, Mercoledì e Giovedì alle 07:30 UTC (09:30 Italiane)
    - cron: '30 7 * * 1,3,4'
    # Report Settimanale Executive: Mercoledì alle 15:00 UTC (17:00 Italiane)
    - cron: '0 15 * * 3'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Seleziona operazione da eseguire'
        required: true
        default: 'outreach'
        type: choice
        options:
          - 'outreach'
          - 'weekly_report'

jobs:
  outreach_job:
    if: github.event.schedule == '30 7 * * 1,3,4' || (github.event_name == 'workflow_dispatch' && inputs.action_type == 'outreach')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui invio lotto B2B Outreach
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/b2b_outreach_engine.py

      - name: Sincronizza log di invio
        run: |
          git config user.name "FotoRoma-Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add data/contacted_log.csv data/unsubscribed.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Aggiornato log invio outreach [skip ci]" && git push)

  weekly_report_job:
    if: github.event.schedule == '0 15 * * 3' || (github.event_name == 'workflow_dispatch' && inputs.action_type == 'weekly_report')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera e invia Report Settimanale (Mercoledì ore 17:00)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/weekly_analytics_reporter.py
