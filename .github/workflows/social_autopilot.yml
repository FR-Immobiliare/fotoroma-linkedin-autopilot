name: Social Autopilot (Facebook, Instagram & LinkedIn)

on:
  schedule:
    # 4 slot intelligenti al giorno (07:00, 11:00, 15:00, 19:00 UTC)
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:

jobs:
  publish_socials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui Autoposter Facebook & Instagram
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '61583126505444' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python scripts/facebook_full_autoposter.py
          python scripts/social_syndication_engine.py
