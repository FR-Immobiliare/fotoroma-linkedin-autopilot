name: Social Engine (Facebook, Instagram & LinkedIn)

on:
  # Schedulazione automatica disattivata per evitare pubblicazioni non desiderate
  # schedule:
  #   - cron: '0 10 * * 2' # Esempio: 1 volta a settimana (Martedì alle 12:00 Italiane)
  workflow_dispatch:

jobs:
  publish_socials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui Autoposter Facebook & Instagram
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '61583126505444' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python scripts/facebook_full_autoposter.py
          python scripts/social_syndication_engine.py
