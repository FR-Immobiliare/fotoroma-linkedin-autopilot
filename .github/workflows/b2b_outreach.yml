name: B2B Outreach & Autonomous Growth Engine

on:
  schedule:
    # 1. Pulizia blacklist e invio lotti Outreach: Lunedì, Mercoledì e Giovedì alle 07:30 UTC (09:30 Italiane)
    - cron: '30 7 * * 1,3,4'
    # 2. Ricerca nuovi lead e Report Settimanale: Mercoledì alle 15:00 UTC (17:00 Italiane)
    - cron: '0 15 * * 3'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Seleziona operazione'
        required: true
        default: 'outreach'
        type: choice
        options:
          - 'outreach'
          - 'weekly_report'
          - 'clean_and_harvest'

jobs:
  outreach_job:
    if: github.event.schedule == '30 7 * * 1,3,4' || (github.event_name == 'workflow_dispatch' && inputs.action_type == 'outreach')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Pulisci blacklist ed esclusioni prima dell'invio
        env:
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/lead_autoloader_and_cleaner.py

      - name: 2. Esegui invio batch sicuro anti-spam (40 email max)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/b2b_outreach_engine.py

      - name: 3. Salva e sincronizza log e blacklist
        run: |
          git config user.name "FotoRoma-Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-pulizia ed aggiornamento log outreach [skip ci]" && git push)

  weekly_report_job:
    if: github.event.schedule == '0 15 * * 3' || (github.event_name == 'workflow_dispatch' && (inputs.action_type == 'weekly_report' || inputs.action_type == 'clean_and_harvest'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Auto-Harvest nuovi contatti e pulizia
        env:
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/lead_autoloader_and_cleaner.py

      - name: 2. Genera e invia Report Settimanale ad Antonio (Mercoledì ore 17:00)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'fotoroma18@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'unsvwxfhkugkklly' }}
        run: |
          python scripts/weekly_analytics_reporter.py

      - name: 3. Salva nuovi lead nel repository
        run: |
          git config user.name "FotoRoma-Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-harvest nuovi prospect ed aggiornamento DB [skip ci]" && git push)
