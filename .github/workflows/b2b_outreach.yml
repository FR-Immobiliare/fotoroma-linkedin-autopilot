name: B2B Outreach & Autonomous Growth Engine

on:
  schedule:
    # 1. Outreach del Mattino: Tutti i feriali (Lunedì - Venerdì) alle 07:30 UTC (09:30 Italiane)
    - cron: '30 7 * * 1-5'
    # 2. Outreach della Sera: Tutti i giorni alle 16:00 UTC (18:00 Italiane)
    - cron: '0 16 * * *'
    # 3. Report Notturno di Mezzanotte ad Antonio: Ogni sera alle 22:00 UTC (00:00 Italiane)
    - cron: '0 22 * * *'
    # 4. Report Settimanale Omnicanale: Mercoledì alle 15:00 UTC (17:00 Italiane)
    - cron: '0 15 * * 3'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Seleziona operazione'
        required: true
        default: 'outreach'
        type: choice
        options:
          - 'outreach'
          - 'midnight_report'
          - 'weekly_report'
          - 'clean_and_harvest'

jobs:
  outreach_job:
    if: github.event.schedule == '30 7 * * 1-5' || github.event.schedule == '0 16 * * *' || (github.event_name == 'workflow_dispatch' && inputs.action_type == 'outreach')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Rileva email respinte (Bounces) e pulisci liste
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/bounce_and_mx_validator.py
          python scripts/lead_autoloader_and_cleaner.py

      - name: 2. Esegui invio batch sicuro anti-spam (30 email max)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/b2b_outreach_engine.py

      - name: 3. Salva e sincronizza log e blacklist
        run: |
          git config user.name "FotoRoma-Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-pulizia bounce ed aggiornamento log outreach [skip ci]" && git push)

  midnight_report_job:
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && inputs.action_type == 'midnight_report')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Invia Report Giornaliero di Mezzanotte ad Antonio
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/daily_midnight_reporter.py

  weekly_report_job:
    if: github.event.schedule == '0 15 * * 3' || (github.event_name == 'workflow_dispatch' && (inputs.action_type == 'weekly_report' || inputs.action_type == 'clean_and_harvest'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Auto-Harvest nuovi contatti e controllo Bounces
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/bounce_and_mx_validator.py
          python scripts/lead_autoloader_and_cleaner.py

      - name: 2. Genera e invia Report Settimanale ad Antonio (Mercoledì ore 17:00)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/weekly_analytics_reporter.py

      - name: 3. Salva nuovi lead nel repository
        run: |
          git config user.name "FotoRoma-Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-harvest nuovi prospect ed aggiornamento DB [skip ci]" && git push)
