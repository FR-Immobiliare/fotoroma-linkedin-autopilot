name: FotoRomaImmobiliare Social Cloud Engine (Facebook & LinkedIn)

on:
  schedule:
    # 2 volte a settimana: Martedì e Venerdì alle 08:30 UTC (10:30 ora italiana)
    - cron: '30 8 * * 2,5'
  workflow_dispatch:

jobs:
  publish-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Social Cloud Engine
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN || secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '861246003736290' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_poster.py

      - name: Commit & Push changes (Move photo to published/)
        run: |
          git config user.name "FotoRoma Autopilot Bot"
          git config user.email "bot@fotoromaimmobiliare.it"
          git add queue_photos/ published/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-archive published photo [skip ci]" && git push)
